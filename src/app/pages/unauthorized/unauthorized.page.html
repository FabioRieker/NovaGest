<ion-header [translucent]="true">
  <ion-toolbar color="danger">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>{{ 'UNAUTHORIZED.TITLE' | translate }}</ion-title>
    <ion-buttons slot="end">
      <app-lang-switcher [compact]="true"></app-lang-switcher>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="unauthorized-content">
  <div class="unauthorized-container">
    <ion-card class="unauthorized-card">
      <ion-card-header>
        <div class="lock-icon" aria-hidden="true">
          <ion-icon name="lock-closed-outline"></ion-icon>
        </div>
        <ion-card-title>{{ 'UNAUTHORIZED.CARD_TITLE' | translate }}</ion-card-title>
        <ion-card-subtitle>{{ 'UNAUTHORIZED.CARD_SUBTITLE' | translate }}</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <p>
          {{ 'UNAUTHORIZED.DESC' | translate }}
        </p>
        <div class="unauthorized-actions">
          <ion-button fill="outline" color="primary" (click)="goBack()">
            <ion-icon slot="start" name="arrow-back-outline"></ion-icon>
            {{ 'UNAUTHORIZED.BACK_BTN' | translate }}
          </ion-button>
          <ion-button color="medium" (click)="switchAccount()">
            <ion-icon slot="start" name="log-out-outline"></ion-icon>
            {{ 'UNAUTHORIZED.SWITCH_BTN' | translate }}
          </ion-button>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
